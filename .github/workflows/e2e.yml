name: e2e

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      google_reel:
        description: "Lancer le parcours Google réel"
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: cortex
    env:
      E2E_DATABASE_URL: postgres://cortex:cortex@127.0.0.1:5432/cortex_e2e
      STRIPE_SECRET_KEY: ${{ github.event_name == 'schedule' && secrets.STRIPE_SECRET_KEY || '' }}
      STRIPE_PRICE_CREDITS_10: ${{ github.event_name == 'schedule' && secrets.STRIPE_PRICE_CREDITS_10 || '' }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ github.event_name == 'schedule' && secrets.STRIPE_PRICE_PRO_MONTHLY || '' }}
      STRIPE_PRICE_PRO_YEARLY: ${{ github.event_name == 'schedule' && secrets.STRIPE_PRICE_PRO_YEARLY || '' }}
      STRIPE_WEBHOOK_SECRET: ${{ github.event_name == 'schedule' && secrets.STRIPE_WEBHOOK_SECRET || '' }}
      E2E_GOOGLE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.google_reel && secrets.E2E_GOOGLE_EMAIL || '' }}
      E2E_GOOGLE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.google_reel && secrets.E2E_GOOGLE_PASSWORD || '' }}
      E2E_GOOGLE_TOTP_SECRET: ${{ github.event_name == 'workflow_dispatch' && inputs.google_reel && secrets.E2E_GOOGLE_TOTP_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parcours Playwright hermétiques
        run: npm run e2e -- --project=desktop --project=iphone
      - name: Google réel (lancement manuel)
        if: github.event_name == 'workflow_dispatch' && inputs.google_reel && env.E2E_GOOGLE_EMAIL != ''
        run: npx playwright install --with-deps chrome && npm run e2e:google
      - name: Charge légère Linux (nuit)
        if: github.event_name == 'schedule'
        run: |
          mkdir -p e2e/.runtime/data
          AUTH_ENABLED=1 AUTH_SECRET=nightly-e2e AUTH_URL=http://127.0.0.1:3210 E2E_TEST_AUTH=1 E2E_TEST_RUN=1 \
          E2E_ALLOW_LOCAL_POSTGRES=1 \
          DB_DRIVER=postgres DATABASE_URL="$E2E_DATABASE_URL" CORTEX_DATA_DIR="$PWD/e2e/.runtime/data" \
          LLM_PROVIDER=openai-compatible LLM_BASE_URL=http://127.0.0.1:3210/api/e2e-llm LLM_API_KEY=e2e MCP_ENABLED=1 \
          BILLING_ENABLED=1 SIGNUP_FREE_CREDITS=0.1 RATE_LIMIT_PER_MIN=unlimited npm run start -- --hostname 127.0.0.1 --port 3210 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3210/api/health >/dev/null && break; sleep 1; done
          E2E_LOAD_SECONDS=5 npm run e2e:charge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            cortex/playwright-report
            cortex/test-results
            cortex/e2e/RAPPORT-CHARGE.md
          if-no-files-found: ignore
