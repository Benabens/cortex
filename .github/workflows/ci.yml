# ⚠ ACTIVATION (une fois) : ce fichier est stagé ici parce que le token de la
# session n'a pas le scope `workflow` (GitHub refuse de pousser sous
# .github/workflows/). Pour l'activer, depuis la racine du repo :
#     mkdir -p .github/workflows && git mv cortex/.ci/ci.yml .github/workflows/ci.yml
#     git commit -m "ci: activer le workflow" && git push
# (le working-directory de la CI est `cortex`, chemins déjà réglés en conséquence).
#
# CI bloquante (Phase D backend-overhaul) — rouge = merge bloqué.
# Garanties : typecheck, build, lint (budget anti-régression), tests unitaires
# (drivers sqlite/pglite, LLM hermétique, sandbox, vérif déterministe),
# et l'INVARIANT CS-202 : la régression prompt/tex doit rester BYTE-IDENTIQUE
# aux hashes canoniques après réparation de la DB + ingestion sur un clone frais.
name: ci

on:
  push:
    branches: [backend-overhaul, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cortex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex/package-lock.json

      - name: Outillage (sqlite3 CLI, sympy, userns pour la sandbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q sqlite3
          python3 -m pip install --quiet sympy || pip install --quiet sympy
          # Ubuntu 23.10+ restreint les user namespaces non privilégiés (requis par unshare -rn)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Dépendances
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

      - name: Lint (budget anti-régression)
        run: |
          npm run lint > /tmp/lint.out 2>&1 || true
          errors=$(grep -oE '\([0-9]+ errors' /tmp/lint.out | grep -oE '[0-9]+' || echo 0)
          budget=$(cat .ci/lint-budget)
          echo "eslint: $errors erreurs (budget: $budget)"
          tail -5 /tmp/lint.out
          if [ "$errors" -gt "$budget" ]; then
            echo "::error::Budget lint dépassé ($errors > $budget) — corrige ou justifie une hausse de .ci/lint-budget"
            exit 1
          fi

      - name: Tests unitaires (drivers, LLM hermétique, sandbox, vérif déterministe, isolation multi-tenant)
        run: npm test

      - name: Invariant CS-202 — réparation DB + ingestion + régression byte-identique
        run: |
          npx tsx scripts/repair-cs202-db.ts --ci
          npx tsx scripts/regression-cs202.ts /tmp/ci-reg | tee /tmp/reg.out
          grep -q '350d533f7b765a97' /tmp/reg.out || { echo '::error::prompt sha ≠ canonique'; exit 1; }
          grep -q '9a294bb25e9d919c' /tmp/reg.out || { echo '::error::tex sha ≠ canonique'; exit 1; }
          echo "✓ régression cs-202 byte-identique"
